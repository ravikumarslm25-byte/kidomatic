services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  api:
    build: .
    ports: ["4000:4000"]
    environment:
      - MONGO_URI=mongodb://mongo:27017/juniorocto
      - JWT_SECRET=change-me-in-production
    depends_on: [mongo]
volumes:
  mongo_data:
